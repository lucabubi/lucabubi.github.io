<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LB monogram">
  <title>LB</title>
  <!-- Auto light/dark: light branch carries the aurora mesh (same washes as
       the page), dark branch stays flat like the dark theme. Browsers that
       ignore SVG-internal queries still get the right tile via the
       media-queried <link> tags in index.html; syncFavicon() drives it
       after hydration. -->
  <style>
    .for-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .for-light { display: none; }
      .for-dark { display: block; }
    }
  </style>
  <defs>
    <clipPath id="lb-tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <radialGradient id="lb-sky" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(42.24 20.48) scale(54.4 21.76)">
      <stop offset="0" stop-color="#a5d2ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a5d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-lavender" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(12.8 26.88) scale(51.2 29.44)">
      <stop offset="0" stop-color="#cdb9ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#cdb9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-peach" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(51.84 36.48) scale(52.48 28.16)">
      <stop offset="0" stop-color="#ffc8aa" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffc8aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-mint" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(12.8 41.6) scale(53.76 24.32)">
      <stop offset="0" stop-color="#aaebcd" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#aaebcd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-rose" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(38.4 44.8) scale(57.6 20.48)">
      <stop offset="0" stop-color="#ffb4cd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb4cd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-sheen" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(32 28.16) scale(48 25.6)">
      <stop offset="0" stop-color="#fffffd" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fffffd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="for-light">
    <g clip-path="url(#lb-tile)">
      <rect width="64" height="64" fill="#fafaf8"/>
      <rect width="64" height="64" fill="url(#lb-sky)"/>
      <rect width="64" height="64" fill="url(#lb-lavender)"/>
      <rect width="64" height="64" fill="url(#lb-peach)"/>
      <rect width="64" height="64" fill="url(#lb-mint)"/>
      <rect width="64" height="64" fill="url(#lb-rose)"/>
      <rect width="64" height="64" fill="url(#lb-sheen)"/>
    </g>
    <g fill="#131515" transform="translate(2 10) scale(0.5)">
      <path d="M16 12H28V64H40V76H16Z"/>
      <path fill-rule="evenodd" d="M52 12H88A16 16 0 0 1 88 44H52ZM81 28a7 7 0 1 0 14 0 7 7 0 1 0-14 0Z"/>
      <path fill-rule="evenodd" d="M52 44H104V76H52ZM64 53H93V67H64Z"/>
    </g>
    <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#131515" stroke-opacity="0.1"/>
  </g>
  <g class="for-dark">
    <rect width="64" height="64" rx="14" fill="#08090b"/>
    <g fill="#f1f2ee" transform="translate(2 10) scale(0.5)">
      <path d="M16 12H28V64H40V76H16Z"/>
      <path fill-rule="evenodd" d="M52 12H88A16 16 0 0 1 88 44H52ZM81 28a7 7 0 1 0 14 0 7 7 0 1 0-14 0Z"/>
      <path fill-rule="evenodd" d="M52 44H104V76H52ZM64 53H93V67H64Z"/>
    </g>
    <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.11"/>
  </g>
</svg>
